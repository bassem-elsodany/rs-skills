# cargo-deny policy (rs-release). `cargo deny check` in CI.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []                          # RUSTSEC ids with a written justification only

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"           # tighten to "deny" once the tree is clean
wildcards = "deny"
deny = [
  { crate = "openssl", reason = "use rustls" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
